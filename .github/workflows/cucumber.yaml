name: cucumber

on:
    push:
        branches:
            - '**'
    workflow_dispatch: { }

jobs:
    cucumber:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Extract JVM version from libs.versions.toml
                id: java-version
                run: |
                    JVM_VERSION=$(grep '^\s*jvm\s*=' gradle/libs.versions.toml | sed 's/.*"\([^"]*\)".*/\1/')
                    echo "version=$JVM_VERSION" >> $GITHUB_OUTPUT

            -   name: Set up JDK
                uses: actions/setup-java@v6
                with:
                    cache: gradle
                    distribution: temurin
                    java-version: ${{ steps.java-version.outputs.version }}

            -   name: Start PostgreSQL
                run: .github/scripts/start_postgresql.sh

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Set up Maven
                uses: stCarolas/setup-maven@v5
                with:
                    maven-version: 3.10.0

            -   name: Start Spring Boot and run Cucumber tests
                run: |
                    .github/scripts/start_spring_boot.sh
                    .github/scripts/run_cucumber_tests.sh

            -   name: Stop Spring Boot
                if: always()
                run: .github/scripts/stop_spring_boot.sh

            -   name: Stop PostgresSQL (podman)
                if: always()
                run: podman-compose down

            -   name: Show spring-boot log
                if: always()
                run: cat bootRun.log
