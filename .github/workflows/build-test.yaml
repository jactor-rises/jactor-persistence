name: build-test

on:
    push:
        branches:
            - '**'
    workflow_dispatch: { }

jobs:
    build-test:
        permissions:
            contents: read
            packages: read
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Extract JVM version from libs.versions.toml
                id: java-version
                run: |
                    JVM_VERSION=$(grep '^\s*jvm\s*=' gradle/libs.versions.toml | sed 's/.*"\([^"]*\)".*/\1/')
                    echo "version=$JVM_VERSION" >> $GITHUB_OUTPUT

            -   name: Set up JDK
                uses: actions/setup-java@v6
                with:
                    cache: gradle
                    distribution: temurin
                    java-version: ${{ steps.java-version.outputs.version }}

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Build and test
                env:
                    GITHUB_ACTOR: ${{ github.actor }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: ./gradlew clean ktlintCheck test build
