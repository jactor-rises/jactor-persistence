name: Renovate

on:
    schedule:
        -   cron: "0 3 * * 5" # 03:00 UTC Friday; within the configured Oslo window
    workflow_dispatch:

jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Run Renovate
                uses: renovatebot/github-action@v46.3.10
                with:
                    token: ${{ secrets.RENOVATE_TOKEN }}
