name: Renovate

on:
    schedule:
        -   cron: "0 3 * * 4" # 03:00 UTC Thursday; within the configured Oslo window
    workflow_dispatch:

jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            -   uses: renovatebot/github-action@v46.3.10
                with:
                    token: ${{ secrets.RENOVATE_TOKEN }}
                    configurationFile: .github/renovate-config.js
