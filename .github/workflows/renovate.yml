name: Renovate

on:
    schedule:
        -   cron: "6 0 * * *" # 00:06 UTC every day
    workflow_dispatch:

jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Run Renovate
                uses: renovatebot/github-action@v46.3.10
                with:
                    token: ${{ secrets.RENOVATE_TOKEN }}
