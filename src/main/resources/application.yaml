spring:
    webflux:
        base-path: /jactor-persistence

app:
    security:
        jactor-password-hash: ${JACTOR_PASSWORD_HASH}
        jwt-secret: ${JWT_SECRET}

logging:
    level:
        com.githnub.jactor: debug

management:
    endpoint:
        health:
            show-details: always
    endpoints:
        web:
            exposure:
                include: "*"

server:
    port: 1099

    threads:
        virtual:
            enabled: true

springdoc:
    packages-to-scan: com.github.jactor.rises.persistence
    swagger-ui:
        path: /swagger-ui.html
        config-url: /jactor-persistence/v3/api-docs/swagger-config
        url: /jactor-persistence/v3/api-docs

---
spring:
  config:
    activate:
      on-profile: "!test"
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres
    username: postgres
    password: mysecretpassword
  flyway:
    url: jdbc:postgresql://localhost:5432/postgres
    user: postgres
    password: mysecretpassword
