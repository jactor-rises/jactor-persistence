spring:
    webflux:
        base-path: /jactor-persistence

logging:
    level:
        com.githnub.jactor: debug

management:
    endpoint:
        health:
            show-details: always
    endpoints:
        web:
            exposure:
                include: "*"

server:
    port: 1099

    threads:
        virtual:
            enabled: true

springdoc:
    packages-to-scan: com.github.jactor.rises.persistence
    swagger-ui:
        path: /swagger-ui.html
        config-url: /jactor-persistence/v3/api-docs/swagger-config
        url: /jactor-persistence/v3/api-docs

---
spring:
  config:
    activate:
      on-profile: "!test"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: mysecretpassword
  sql:
    init:
      username: postgres
      password: mysecretpassword
